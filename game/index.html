<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: 노치 있는 기기에서 화면 끝까지 쓴다. 대신 UI가 노치 밑으로
         들어가지 않게 CSS에서 safe-area-inset 으로 밀어 준다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1017" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TowerWar</title>
  </head>
  <body>
    <!-- 첫 실행에서만 뜬다. 닉네임이 없으면 로비보다 먼저 나온다. -->
    <div id="name" class="screen" hidden>
      <h1 class="logo">TowerWar</h1>
      <p class="pvp-title">닉네임과 아바타</p>
      <p id="name-error" class="pvp-detail"></p>
      <div class="menu">
        <input
          id="name-input"
          class="code-input name-input"
          placeholder="이름을 입력하세요"
          maxlength="12"
          autocomplete="off"
          spellcheck="false"
        />
        <!-- 아바타 카드는 카탈로그(src/profiles.ts)에서 만들어 넣는다. -->
        <div class="avatar-grid" id="avatar-grid"></div>
        <button id="btn-name-ok" class="btn btn-primary">시작</button>
      </div>
    </div>

    <div id="lobby" class="screen" hidden>
      <div class="account-bar">
        <img id="acc-avatar" class="acc-avatar" alt="" hidden />
        <span id="acc-name" class="acc-name"></span>
        <span id="acc-coins" class="coins">0</span>
        <span id="acc-tier" class="tier"></span>
        <span id="acc-record" class="record"></span>
      </div>
      <h1 class="logo">TowerWar</h1>
      <p class="tagline">보급선을 긋고 전선을 밀어라</p>
      <div class="menu">
        <button id="btn-auto" class="btn btn-primary">자동 매칭</button>
        <button id="btn-friend" class="btn">친구랑 하기</button>
        <button id="btn-shop" class="btn">상점</button>
      </div>
    </div>

    <!-- 대기 화면. 자동 매칭과 친구랑 하기가 같은 판을 만드는 길이라 화면 하나를 나눠 쓴다.
         `pvp-friend` 만 켜고 끄면 되고, 방·시드·플레이어 번호는 어느 길이든 서버가 정한다. -->
    <div id="pvp" class="screen" hidden>
      <p id="pvp-title" class="pvp-title">대전</p>
      <p id="pvp-status" class="pvp-status"></p>
      <!-- 자동 매칭에서 상대를 찾는 동안만 흐른다. 오류 문구(#pvp-detail)와 자리를
           나눠 쓰면 실패했을 때 시간이 오류를 밀어낸다. -->
      <p id="pvp-timer" class="pvp-timer" hidden></p>
      <p id="pvp-detail" class="pvp-detail"></p>

      <!-- 발급받은 코드. 친구를 부를 때만 보인다. -->
      <p id="pvp-code" class="pvp-code-shown" hidden></p>

      <div class="menu">
        <div id="pvp-friend" class="friend-controls" hidden>
          <div class="pvp-code">
            <input
              id="pvp-code-input"
              class="code-input"
              placeholder="친구 방 코드"
              maxlength="4"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
            />
            <button id="btn-pvp-join" class="btn">참가</button>
          </div>
          <button id="btn-pvp-host" class="btn">방 만들기</button>
        </div>
        <button id="btn-pvp-cancel" class="btn">돌아가기</button>
      </div>
    </div>

    <!-- 상점. 매치 안에는 사는 수단이 없다 — 전부 여기서 산다. -->
    <div id="shop" class="screen screen-scroll" hidden>
      <div class="account-bar">
        <span id="shop-coins" class="coins">0</span>
      </div>

      <div class="shop">
        <p class="shop-title">영구 강화</p>
        <button class="shop-row" id="buy-speed">
          <span class="shop-head">
            <span class="shop-name">생산 속도</span>
            <span class="shop-pips" data-role="pips"></span>
          </span>
          <span class="shop-foot">
            <span class="shop-effect" data-role="effect"></span>
            <span class="shop-price" data-role="price"></span>
          </span>
        </button>
      </div>

      <!-- 유닛 카드는 카탈로그(src/units.ts)에서 만들어 넣는다. 종류가 늘면 여기는 안 고친다. -->
      <div class="shop">
        <p class="shop-title">유닛 — 비쌀수록 체력과 공격력이 높다</p>
        <div class="unit-grid" id="unit-grid"></div>
      </div>

      <div class="menu">
        <button id="btn-shop-back" class="btn">돌아가기</button>
      </div>
    </div>

    <canvas id="stage" hidden></canvas>

    <!-- 매치 중에만 뜬다. **캔버스가 아니라 DOM이다** — 캔버스에 버튼을 그리면
         그 뒤에서 절단 스와이프가 시작되는 버그를 따로 막아야 한다 (§4.5). -->
    <button id="btn-gear" class="gear" aria-label="설정" hidden>⚙</button>

    <div id="settings" class="screen screen-overlay" hidden>
      <p class="result-title settings-title">설정</p>
      <!-- 봇전에서는 판이 멈춘다. 대전에서는 상대가 계속 두므로 멈출 수가 없어
           그 사실을 화면에 적는다 — 멈춘 줄 알고 있다가 밀리면 그게 더 나쁘다. -->
      <p id="settings-note" class="pvp-detail"></p>
      <div class="menu">
        <!-- 사용자 지시로 재확인 창을 없앴다. 대신 대가를 버튼 바로 아래에 적는다 —
             누르면 되돌릴 수 없고 코인도 0인데 안 알리면 그게 더 나쁘다. -->
        <button id="btn-resign" class="btn btn-danger">항복하기</button>
        <p class="pvp-detail resign-warn">누르면 즉시 패배로 끝나고 <b>코인을 받지 못합니다.</b></p>
        <button id="btn-settings-close" class="btn btn-primary">계속하기</button>
      </div>
    </div>

    <div id="result" class="screen screen-overlay" hidden>
      <p id="result-title" class="result-title"></p>
      <p id="result-reward" class="reward"></p>
      <div class="menu menu-row">
        <button id="btn-again" class="btn btn-primary">다시 하기</button>
        <button id="btn-lobby" class="btn">로비로</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
