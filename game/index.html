<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: 노치 있는 기기에서 화면 끝까지 쓴다. 대신 UI가 노치 밑으로
         들어가지 않게 CSS에서 safe-area-inset 으로 밀어 준다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1017" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- 탭 아이콘. **아바타를 그대로 쓴다** — 이 게임의 얼굴이 비어갱이고, 따로 그린
         아이콘이 없다. `assets/` 가 `.gitignore` 라 클론하면 안 뜨는데, 그때는 브라우저
         기본 아이콘으로 떨어질 뿐 아무것도 안 깨진다 (그림 폴백과 같은 규칙). -->
    <link rel="icon" type="image/png" href="/assets/profile/beergang.png" />
    <link rel="apple-touch-icon" href="/assets/profile/beergang.png" />
    <title>TowerWar</title>
  </head>
  <body>
    <!-- 첫 실행에서만 뜬다. 닉네임이 없으면 로비보다 먼저 나온다. -->
    <div id="name" class="screen" hidden>
      <h1 class="logo">TowerWar</h1>
      <p class="pvp-title" data-i18n="nameTitle">Name and Avatar</p>
      <p id="name-error" class="pvp-detail"></p>
      <div class="menu">
        <input
          id="name-input"
          class="code-input name-input"
          data-i18n-ph="namePlaceholder" placeholder="Enter your name"
          maxlength="12"
          autocomplete="off"
          spellcheck="false"
        />
        <!-- 아바타 카드는 카탈로그(src/profiles.ts)에서 만들어 넣는다. -->
        <div class="avatar-grid" id="avatar-grid"></div>
        <button id="btn-name-ok" class="btn btn-primary" data-i18n="start">Start</button>
      </div>
    </div>

    <div id="lobby" class="screen" hidden>
      <div class="lobby-grid" aria-hidden="true"></div>
      <img class="lobby-watermark" src="/assets/profile/beergang.png" alt="" aria-hidden="true" />
      <div class="lobby-edge lobby-edge-left" aria-hidden="true"></div>
      <div class="lobby-edge lobby-edge-right" aria-hidden="true"></div>
      <div class="account-bar">
        <img id="acc-avatar" class="acc-avatar" alt="" hidden />
        <span id="acc-name" class="acc-name"></span>
        <span id="acc-coins" class="coins">0</span>
        <span id="acc-rating" class="rating"></span>
        <span id="acc-record" class="record"></span>
      </div>
      <!-- 마스코트. **글자 뒤에 옅게 깐다** — 로비가 글자만 있어서 무엇을 하는
           게임인지 그림으로 안 읽혔다. `alt` 가 비어 있는 것은 장식이라서다
           (스크린리더가 읽을 내용이 없다). 클릭을 막지 않게 `pointer-events: none`. -->
      <img class="mascot" src="/assets/profile/beergang.png" alt="" aria-hidden="true" />
      <div class="lobby-title-block">
        <span class="lobby-kicker" aria-hidden="true">TACTICAL COMMAND</span>
        <h1 class="logo">TowerWar</h1>
        <p class="tagline" data-i18n="tagline">Draw supply lines. Push the front.</p>
      </div>
      <div class="menu">
        <button id="btn-auto" class="btn btn-primary" data-i18n="autoMatch">Quick Match</button>
        <button id="btn-friend" class="btn" data-i18n="playFriend">Play a Friend</button>
        <button id="btn-shop" class="btn" data-i18n="shop">Shop</button>
        <button id="btn-board" class="btn" data-i18n="ranking">Ranking</button>
        <button id="btn-settings" class="btn" data-i18n="settings">Settings</button>
      </div>
    </div>

    <!-- 순위. 목록은 서버에서 받아 채운다 (app/board-scene.ts) — 여기는 껍데기만 둔다. -->
    <div id="board" class="screen" hidden>
      <p class="shop-title" data-i18n="boardTitle">Ranking — Top 10 by score</p>
      <ol id="board-list" class="board-list"></ol>
      <!-- 서버에 못 붙었거나 아직 아무도 대전을 안 끝냈을 때. 빈 목록만 두면
           고장인지 비어 있는 건지 구분이 안 된다. -->
      <!-- 표가 비었을 때만 뜬다. 글자만 있으면 화면이 고장난 것처럼 보인다. -->
      <img id="board-mascot" class="board-mascot" src="/assets/profile/beergang.png" alt="" aria-hidden="true" hidden />
      <p id="board-note" class="pvp-detail" hidden></p>
      <div class="menu">
        <button id="btn-board-back" class="btn" data-i18n="back">Back</button>
      </div>
    </div>

    <!-- 설정. 지금은 언어 하나뿐이다. **매치 중에는 못 연다** — 판을 멈추는 창은
         봇전에서만 멈춰서 상대가 봇인지 알려 줬다(§-38). 여기는 로비 전용이다. -->
    <div id="settings" class="screen" hidden>
      <p class="shop-title" data-i18n="settings">Settings</p>
      <div class="shop">
        <p class="shop-title" data-i18n="language">Language</p>
        <div class="lang-row" id="lang-row"></div>
      </div>
      <!-- 음량. 슬라이더는 코드가 만들어 넣는다 (`settings-scene.ts`) — 세 개가
           같은 모양이라 HTML에 세 번 적을 이유가 없다. -->
      <div class="shop">
        <p class="shop-title" data-i18n="sound">Sound</p>
        <div id="vol-rows"></div>
      </div>

      <div class="menu">
        <button id="btn-settings-back" class="btn" data-i18n="back">Back</button>
      </div>
    </div>

    <!-- 대기 화면. 자동 매칭과 친구랑 하기가 같은 판을 만드는 길이라 화면 하나를 나눠 쓴다.
         `pvp-friend` 만 켜고 끄면 되고, 방·시드·플레이어 번호는 어느 길이든 서버가 정한다. -->
    <div id="pvp" class="screen" hidden>
      <div class="match-grid" aria-hidden="true"></div>
      <img class="match-watermark" src="/assets/profile/beergang.png" alt="" aria-hidden="true" />
      <div class="match-radar" aria-hidden="true"><i></i><i></i><i></i></div>
      <!-- 씬이 `titleText()` 로 덮는다. 여기 글자는 첫 프레임용 자리표다. -->
      <div class="match-title-block">
        <span class="match-kicker" aria-hidden="true">LINK ESTABLISHMENT</span>
        <p id="pvp-title" class="pvp-title" data-i18n="pvpTitleAuto">Match</p>
      </div>
      <div class="match-status-panel">
        <span class="match-status-light" aria-hidden="true"></span>
        <p id="pvp-status" class="pvp-status"></p>
      <!-- 자동 매칭에서 상대를 찾는 동안만 흐른다. 오류 문구(#pvp-detail)와 자리를
           나눠 쓰면 실패했을 때 시간이 오류를 밀어낸다. -->
      <p id="pvp-timer" class="pvp-timer" hidden></p>
      <p id="pvp-detail" class="pvp-detail"></p>
      </div>

      <!-- 발급받은 코드. 친구를 부를 때만 보인다. -->
      <p id="pvp-code" class="pvp-code-shown" hidden></p>

      <div class="menu">
        <div id="pvp-friend" class="friend-controls" hidden>
          <div class="pvp-code">
            <input
              id="pvp-code-input"
              class="code-input"
              data-i18n-ph="roomCodePlaceholder" placeholder="Room code"
              maxlength="4"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
            />
            <button id="btn-pvp-join" class="btn" data-i18n="join">Join</button>
          </div>
          <button id="btn-pvp-host" class="btn" data-i18n="hostRoom">Host Room</button>
        </div>
        <button id="btn-pvp-cancel" class="btn" data-i18n="back">Back</button>
      </div>
    </div>

    <!-- 상점. 매치 안에는 사는 수단이 없다 — 전부 여기서 산다. -->
    <div id="shop" class="screen screen-scroll" hidden>
      <div class="account-bar">
        <span id="shop-coins" class="coins">0</span>
      </div>

      <div class="shop">
        <p class="shop-title" data-i18n="shopUpgrades">Permanent Upgrades</p>
        <button class="shop-row" id="buy-speed">
          <span class="shop-head">
            <span class="shop-name" data-i18n="shopSpeed">Production Speed</span>
            <span class="shop-pips" data-role="pips"></span>
          </span>
          <span class="shop-foot">
            <span class="shop-effect" data-role="effect"></span>
            <span class="shop-price" data-role="price"></span>
          </span>
        </button>
      </div>

      <!-- 유닛 카드는 카탈로그(src/units.ts)에서 만들어 넣는다. 종류가 늘면 여기는 안 고친다. -->
      <div class="shop">
        <p class="shop-title" data-i18n="shopUnits">Units — pricier means more health and attack</p>
        <!-- 광고 카드도 이 격자에 들어간다 (`shop-scene.ts`). 유닛 5개 + 광고 1개 =
             3열 두 줄이 정확히 찬다 — 전에는 광고가 따로 있어 격자에 빈칸이 남았다. -->
        <div class="unit-grid" id="unit-grid"></div>
        <p id="ad-note" class="pvp-detail" hidden></p>
      </div>

      <!-- 유료(VX). 코인 칸과 갈라 둔다 — 사는 곳이 다르다 (Verse8 CrossRamp). -->
      <div class="shop">
        <p class="shop-title" data-i18n="shopVx">VX — Real-money</p>
        <div class="unit-grid" id="premium-grid"></div>
        <!-- 유닛이 아닌 유료 항목(배속 등). 카드 모양이 달라 자리를 갈라 둔다. -->
        <div id="premium-items"></div>
        <p id="vx-note" class="pvp-detail"></p>
      </div>

      <div class="menu">
        <button id="btn-shop-back" class="btn" data-i18n="back">Back</button>
      </div>
    </div>

    <canvas id="stage" hidden></canvas>

    <!-- 매치 중에만 뜬다. **캔버스가 아니라 DOM이다** — 캔버스에 버튼을 그리면
         그 뒤에서 절단 스와이프가 시작되는 버그를 따로 막아야 한다 (§4.5).

         **설정 창이 없다** (2026-08-01 사용자 지시). 전에는 톱니로 창을 열고 그 안에
         항복이 있었는데, 그 창이 봇전에서만 판을 멈춰서 상대가 봇인지 알려 줬다.
         §-7이 안 알리기로 한 것을 UI가 흘리고 있던 셈이다. 창째로 걷어냈다. -->
    <button id="btn-resign" class="hud-btn resign-btn" data-i18n="resign" hidden>Resign</button>

    <!-- 배속 토글(유료). **우상단, 전선 막대 바로 아래.** 판때기가 66px이라 그 밑에서
         시작해야 상대 아바타와 막대를 안 덮는다 (`.tempo-btn` 주석). -->
    <button id="btn-tempo" class="hud-btn tempo-btn" hidden>1×</button>

    <div id="result" class="screen screen-overlay" hidden>
      <p id="result-title" class="result-title"></p>
      <p id="result-reward" class="reward"></p>
      <!-- 점수 변동. 서버가 계산해 돌려주므로 보상보다 늦게 채워진다 (app/match-scene.ts). -->
      <p id="result-rating" class="result-rating" hidden></p>
      <!-- 판이 끝난 뒤 광고로 보상 2배. 서버가 지불한 값을 한 번 더 준다. -->
      <button id="btn-ad-double" class="btn btn-ad" hidden>Watch an ad — double it</button>
      <div class="menu menu-row">
        <button id="btn-again" class="btn btn-primary" data-i18n="playAgain">Play Again</button>
        <button id="btn-lobby" class="btn" data-i18n="toLobby">Lobby</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
